<!doctype html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mantenimiento de productos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  
  <body>
  <main class="container py-4">
    <h1 class="h2 mb-4">Mantenimiento de productos</h1>
    <a href="./tiendas.html">Tiendas</a>
    <div id="mensaje" class="mb-3" aria-live="polite"></div>
  
    <div class="row g-4">
      <section class="col-12 col-md-4" aria-labelledby="tituloFormulario">
        <div class="card">
          <div class="card-header" id="tituloFormulario">Nuevo producto</div>
          <div class="card-body">
            <form id="formProducto">
              <input type="hidden" id="id">
  
              <div class="mb-3">
                <label for="marca" class="form-label">Marca</label>
                <input type="text" id="marca" class="form-control" required>
              </div>
  
              <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <input type="text" id="descripcion" class="form-control" required>
              </div>
  
              <div class="mb-3">
                <label for="precio" class="form-label">Precio</label>
                <input type="number" min="0" step="0.01" id="precio" class="form-control" required>
              </div>
  
              <div class="mb-3">
                <label for="stock" class="form-label">Stock</label>
                <input type="number" min="0" step="1" value="1" id="stock" class="form-control" required>
              </div>
  
              <button type="submit" class="btn btn-primary">Guardar</button>
              <button type="reset" class="btn btn-secondary">Cancelar</button>
            </form>
          </div>
        </div>
      </section>
  
      <section class="col-12 col-md-8" aria-label="Listado de productos">
        <form id="formBuscar" class="d-flex gap-2 mb-3">
          <input type="number" min="1" id="buscarId" class="form-control" placeholder="Escriba el ID"
            aria-label="ID del producto" required>
          <button type="submit" class="btn btn-outline-primary">Buscar</button>
          <button type="button" id="mostrarTodo" class="btn btn-outline-secondary">Ver todos</button>
        </form>
  
        <div class="table-responsive">
          <table class="table table-striped table-hover">
            <thead>
              <tr>
                <th scope="col">ID</th>
                <th scope="col">Marca</th>
                <th scope="col">Descripción</th>
                <th scope="col">Precio</th>
                <th scope="col">Stock</th>
                <th scope="col">Acciones</th>
              </tr>
            </thead>
            <tbody id="cuerpoTabla">
              <tr>
                <td colspan="6" class="text-center text-muted">Cargando productos...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>
    </div>
  </main>
  
  <script src="js/productos.js"></script>
  </body>
</html>
